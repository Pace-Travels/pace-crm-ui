<div class="header">
    <!-- Left -->
    <div class="header-left">

        <button class="menu-btn" (click)="onToggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </button>

    </div>
    <div class="header-right">

        <!-- Desktop -->

        <button class="icon-btn desktop-only">
            <i class="fa-solid fa-bell"></i>
        </button>

        <button class="icon-btn desktop-only">
            <i class="fa-solid fa-gear"></i>
        </button>

        <button class="icon-btn desktop-only">
            <i class="fa-solid fa-globe"></i>
        </button>

        <div class="profile desktop-only">

            <div class="avatar">{{ userInitial }}</div>

            <div class="user-info">
                <span class="name">{{ userName }}</span>
                <span class="role">{{ userRole }}</span>
            </div>

            <i class="fa-solid fa-angle-down"></i>

        </div>

        <!-- MOBILE MORE FIRST -->

        <p-menu #moreMenu [popup]="true" [model]="mobileItems">
        </p-menu>

        <button class="mobile-more" (click)="moreMenu.toggle($event)">

            <i class="fa-solid fa-ellipsis-vertical"></i>

        </button>

        <!-- MOBILE PROFILE SECOND -->

        <p-menu #profileMenu [popup]="true" [model]="profileItems">
        </p-menu>

        <button class="mobile-profile" (click)="profileMenu.toggle($event)">

            <div class="avatar">{{ userInitial }}</div>

        </button>

    </div>
</div>
