<div class="overlay" *ngIf="mobileOpen()" (click)="toggleSidebar()">
</div>

<aside class="sidebar" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">

    <!-- Logo -->

    <div class="logo">

        <div class="logo-icon">
            P
        </div>

        @if(!collapsed()){

        <div class="logo-text">

            <h2>Pace</h2>

            <span>CRM</span>

        </div>

        }

    </div>

    <!-- Project Selector Dropdown -->
    @if (!collapsed()) {
        <div class="project-selector-wrapper" style="padding: 12px 24px; border-bottom: 1px solid #eaeaea; width: 100%; box-sizing: border-box;">
            <div style="font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px;">Active Brand Project</div>
            <select class="form-control" style="padding: 6px 10px; font-size: 12px; font-weight: 600; border-color: #cbd5e1; width: 100%; border-radius: 6px; outline: none; background: white;" 
                    [ngModel]="projectService.currentProject()?.id" 
                    (ngModelChange)="onProjectSelectChange($event)">
                @if (projectService.projects().length === 0) {
                    <option [value]="0">No projects active</option>
                }
                @for(p of projectService.projects(); track p.id) {
                    <option [value]="p.id">{{ p.name }}</option>
                }
            </select>
        </div>
    }

    <!-- Scrollable Menu -->

    <div class="sidebar-menu">

        <ul>

            @for(item of menu;track item.title){

            <li>

                <a [routerLink]="item.route" routerLinkActive="active">

                    <div class="menu-item-content">
                        <i [class]="item.icon"></i>
                        <span>{{item.title}}</span>
                    </div>

                </a>

            </li>

            }

        </ul>

    </div>

    <!-- Account section at the bottom -->
    <div class="sidebar-bottom">
        <ul>
            <li>
                <a routerLink="/account" routerLinkActive="active">
                    <div class="menu-item-content">
                        <i class="fa-solid fa-circle-user"></i>
                        <span>Account</span>
                    </div>
                </a>
            </li>
        </ul>
    </div>

</aside>
