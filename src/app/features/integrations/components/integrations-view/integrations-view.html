<div class="integrations-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-family: 'Inter', sans-serif;">
    <div>
        <h2 style="font-size: 22px; font-weight: 700; color: #0f172a; margin: 0 0 4px 0;">Integration App Store</h2>
        <p style="font-size: 13px; color: #64748b; margin: 0;">Connect your CRM with E-commerce stores, Payment Gateways, and Automation triggers.</p>
    </div>
    
    <div style="display: flex; gap: 8px; background: white; padding: 4px; border-radius: 8px; border: 1px solid #cbd5e1;">
        <button [class.active]="activeFilter() === 'ALL'" (click)="activeFilter.set('ALL')" style="padding: 6px 14px; border: none; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer;" [style.background]="activeFilter() === 'ALL' ? '#0f172a' : 'transparent'" [style.color]="activeFilter() === 'ALL' ? 'white' : '#64748b'">All Apps</button>
        <button [class.active]="activeFilter() === 'CHANNELS'" (click)="activeFilter.set('CHANNELS')" style="padding: 6px 14px; border: none; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer;" [style.background]="activeFilter() === 'CHANNELS' ? '#0f172a' : 'transparent'" [style.color]="activeFilter() === 'CHANNELS' ? 'white' : '#64748b'">Channels</button>
        <button [class.active]="activeFilter() === 'ECOMMERCE'" (click)="activeFilter.set('ECOMMERCE')" style="padding: 6px 14px; border: none; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer;" [style.background]="activeFilter() === 'ECOMMERCE' ? '#0f172a' : 'transparent'" [style.color]="activeFilter() === 'ECOMMERCE' ? 'white' : '#64748b'">E-Commerce</button>
        <button [class.active]="activeFilter() === 'PAYMENTS'" (click)="activeFilter.set('PAYMENTS')" style="padding: 6px 14px; border: none; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer;" [style.background]="activeFilter() === 'PAYMENTS' ? '#0f172a' : 'transparent'" [style.color]="activeFilter() === 'PAYMENTS' ? 'white' : '#64748b'">Payments</button>
        <button [class.active]="activeFilter() === 'AUTOMATION'" (click)="activeFilter.set('AUTOMATION')" style="padding: 6px 14px; border: none; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer;" [style.background]="activeFilter() === 'AUTOMATION' ? '#0f172a' : 'transparent'" [style.color]="activeFilter() === 'AUTOMATION' ? 'white' : '#64748b'">Automation</button>
    </div>
</div>

<div class="integrations-content" style="font-family: 'Inter', sans-serif;">
    <div class="app-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;">
        <div *ngFor="let app of filteredApps" class="app-card" style="background: white; border: 1px solid #cbd5e1; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.2s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.02);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 20px rgba(0,0,0,0.06)'" onmouseout="this.style.transform='none'; this.style.boxShadow='0 2px 6px rgba(0,0,0,0.02)'">
            <div>
                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px;">
                    <div class="app-icon" style="width: 44px; height: 44px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 20px;">
                        <i [class]="app.icon"></i>
                    </div>
                    <span [style.background]="app.status === 'CONNECTED' ? '#dcfce7' : '#f1f5f9'" [style.color]="app.status === 'CONNECTED' ? '#15803d' : '#64748b'" style="padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase;">
                        ● {{ app.status }}
                    </span>
                </div>

                <h4 style="margin: 0 0 6px 0; font-size: 15px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px;">
                    {{ app.name }} 
                    <span *ngIf="app.isNew" style="font-size: 10px; background: #3b82f6; color: white; padding: 2px 6px; border-radius: 4px; font-weight: 700;">NEW</span>
                </h4>
                <p style="margin: 0 0 16px 0; font-size: 13px; color: #64748b; line-height: 1.4;">{{ app.desc }}</p>
            </div>

            <div style="border-top: 1px solid #f1f5f9; padding-top: 14px; display: flex; justify-content: flex-end;">
                <button (click)="openConfig(app)" style="background: #0f172a; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer;">
                    {{ app.status === 'CONNECTED' ? 'Configure App' : 'Connect Integration' }}
                </button>
            </div>
        </div>
    </div>
</div>

<!-- WhatsApp Link & QR Generator Modal -->
<div *ngIf="showWaLinkModal()" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; font-family: 'Inter', sans-serif;">
    <div style="background: white; width: 540px; border-radius: 12px; padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">
            <h3 style="margin: 0; font-size: 18px; font-weight: 700; color: #0f172a;">WhatsApp Shareable Link & QR Code Generator</h3>
            <button (click)="showWaLinkModal.set(false)" style="background: none; border: none; font-size: 18px; cursor: pointer; color: #64748b;">✕</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px;">
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #334155;">WhatsApp Business Phone Number *</label>
                <input type="text" [(ngModel)]="waLinkPhone" (input)="generateWaLink()" placeholder="+919876543210" style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13.5px; margin-top: 4px; outline: none; font-weight: 600;">
            </div>

            <div>
                <label style="font-size: 12px; font-weight: 700; color: #334155;">Predefined Greeting Message</label>
                <textarea rows="3" [(ngModel)]="waLinkMessage" (input)="generateWaLink()" style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13.5px; margin-top: 4px; outline: none;"></textarea>
            </div>

            <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; display: flex; gap: 16px; align-items: center;">
                <img [src]="qrCodeUrl()" alt="WhatsApp QR Code" style="width: 120px; height: 120px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; padding: 4px;">
                <div style="flex: 1;">
                    <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase;">Direct Link</label>
                    <div style="display: flex; gap: 6px; margin-top: 4px;">
                        <input type="text" [value]="generatedWaLink()" readonly style="flex: 1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; background: white; font-family: monospace;">
                        <button (click)="copyLink(generatedWaLink())" style="background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer;">Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end;">
            <button (click)="showWaLinkModal.set(false)" style="background: #0f172a; color: white; border: none; padding: 9px 20px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer;">Done</button>
        </div>
    </div>
</div>

<!-- Generic App Integration Config Modal -->
<div *ngIf="showConfigModal()" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; font-family: 'Inter', sans-serif;">
    <div style="background: white; width: 500px; border-radius: 12px; padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">
            <h3 style="margin: 0; font-size: 18px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px;">
                <i [class]="selectedApp()?.icon"></i> Configure {{ selectedApp()?.name }}
            </h3>
            <button (click)="showConfigModal.set(false)" style="background: none; border: none; font-size: 18px; cursor: pointer; color: #64748b;">✕</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px;">
            <div>
                <label style="font-size: 12px; font-weight: 700; color: #334155;">API Key / Access Token *</label>
                <input type="password" [(ngModel)]="configApiKey" placeholder="Enter Integration API Key or Token" style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13.5px; margin-top: 4px; outline: none;">
            </div>

            <div>
                <label style="font-size: 12px; font-weight: 700; color: #334155;">Secret Token / Signing Key</label>
                <input type="password" [(ngModel)]="configSecret" placeholder="Enter Webhook Secret (Optional)" style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13.5px; margin-top: 4px; outline: none;">
            </div>

            <div>
                <label style="font-size: 12px; font-weight: 700; color: #334155;">Incoming Webhook Trigger URL</label>
                <div style="display: flex; gap: 6px; margin-top: 4px;">
                    <input type="text" [value]="configWebhookUrl" readonly style="flex: 1; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; background: #f8fafc; font-family: monospace;">
                    <button (click)="copyLink(configWebhookUrl)" style="background: #0f172a; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Copy URL</button>
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <button (click)="showConfigModal.set(false)" style="background: white; border: 1px solid #cbd5e1; color: #475569; padding: 9px 18px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer;">Cancel</button>
            <button (click)="saveIntegration()" style="background: #10b981; color: white; border: none; padding: 9px 20px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer;">Save & Connect</button>
        </div>
    </div>
</div>
