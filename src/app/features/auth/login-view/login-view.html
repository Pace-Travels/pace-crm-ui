<div class="login-container">
    <div class="login-left">
        <div class="brand">
            <i class="fa-solid fa-bolt text-green"></i> <span class="logo-text">Pace Messenger</span>
        </div>
        
        <h1 class="headline">Send personalized campaigns on WhatsApp</h1>

        <!-- Abstract visual placeholder using FontAwesome and CSS -->
        <div class="visual-wrapper">
            <div class="mock-ui mock-img">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            <div class="mock-ui float-card fb-ad">
                <div class="header">
                    <div class="circle"></div> <span>Sponsored</span>
                </div>
                <div class="ad-image">20% OFF</div>
                <div class="footer"><i class="fa-solid fa-heart text-red"></i> <i class="fa-regular fa-comment"></i></div>
            </div>
            <div class="mock-ui float-card wa-msg">
                <span class="user-name">User</span>
                <p>I want to buy</p>
                <p class="time">10:42 AM <i class="fa-solid fa-check-double text-blue"></i></p>
            </div>
            <div class="mock-ui float-card order-success">
                <i class="fa-solid fa-circle-check text-green"></i> Order Placed
            </div>
        </div>

        <div class="trusted-by">
            <p>Trusted by 2,50,000+ businesses</p>
            <div class="logos">
                <span>adani</span>
                <span>TATA</span>
                <span>Godrej</span>
                <span>vivo</span>
            </div>
        </div>
    </div>

    <div class="login-right">
        <div class="top-nav">
            Not a member yet? <a routerLink="/signup">Sign up</a>
        </div>
        
        <div class="login-form-wrapper">
            <div class="form-header">
                <span class="subtitle">WELCOME BACK</span>
                <h2>Log in to Pace Messenger</h2>
            </div>

            <button class="btn btn-google" (click)="googleLogin()" [disabled]="isSubmitting">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>

            <div class="divider">
                <span>OR</span>
            </div>

            <form class="form" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
                <div class="form-group">
                    <label>Username / Email</label>
                    <input type="text" formControlName="email" placeholder="Enter your email">
                </div>
                
                <div class="form-group password-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Enter your password">
                        <i class="fa-regular toggle-pw" 
                           [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'" 
                           (click)="togglePassword()"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isSubmitting">
                    {{ isSubmitting ? 'Logging in...' : 'Continue' }}
                </button>
            </form>

            <div class="form-footer">
                <a href="#" (click)="forgotPassword($event)">Forgot Password?</a>
            </div>
        </div>
    </div>
</div>
