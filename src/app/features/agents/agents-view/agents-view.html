<div class="agents-container">
    <div class="setup-modal">
        <div class="modal-header">
            <div class="icon-square">
                <i class="fa-solid fa-robot"></i>
            </div>
            <h2>Set up your AI Agent</h2>
        </div>

        <div class="modal-body">
            <div class="intro-section">
                <div class="globe-icon">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <h3>Let's build your agent from your website</h3>
                <p>Tell us about your business — we'll read your pages in the background and have your agent ready to test.</p>
            </div>

            <form class="setup-form">
                <div class="form-group">
                    <label>Website <span class="required">*</span></label>
                    <input type="text" placeholder="https://yourstore.com">
                    <small>We'll crawl this to build your agent's knowledge.</small>
                </div>

                <div class="form-group">
                    <label>Anything special it should know?</label>
                    <textarea placeholder="Optional ground rules — e.g. Never promise same-day delivery. Always mention the festive 15% off above ₹1,000." rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label>Business context</label>
                    <textarea placeholder="Describe what the business does. Leave blank to draft it from your website." rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label>Agent / business name</label>
                    <input type="text" placeholder="How the agent introduces itself">
                </div>

                <div class="form-group">
                    <label>Greeting message</label>
                    <input type="text" placeholder="Sent word-for-word as the first message (optional)">
                </div>
            </form>
        </div>

        <div class="modal-footer">
            <button class="btn btn-primary"><i class="fa-solid fa-wand-magic-sparkles"></i> Create agent</button>
        </div>
    </div>
</div>
