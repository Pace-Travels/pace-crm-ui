<div class="launch-section">
    <div class="launch-header">
        <h4>What would you like to launch?</h4>
    </div>
    
    <div class="cards-container">
        <!-- Card 1: Broadcast -->
        <div class="action-card">
            <div class="card-icon"><i class="fa-solid fa-bullhorn text-purple"></i></div>
            <div class="card-content">
                <h5>Broadcast</h5>
                <p>Send highly engaging offers to your users</p>
                <button (click)="onLaunch('BROADCAST')" class="btn btn-outline">Launch</button>
            </div>
        </div>

        <!-- Card 2: AI Agent -->
        <div class="action-card">
            <div class="card-icon"><i class="fa-solid fa-robot text-blue"></i></div>
            <div class="card-content">
                <h5>AI Agent</h5>
                <p>Let AI agents launch campaigns for you</p>
                <button (click)="onLaunch('AI_AGENT')" class="btn btn-outline">Launch</button>
            </div>
        </div>

        <!-- Card 3: Status Ad -->
        <div class="action-card">
            <div class="card-icon"><i class="fa-brands fa-whatsapp text-green"></i></div>
            <div class="card-content">
                <h5>Status Ad</h5>
                <p>Run ads on WhatsApp Status</p>
                <button (click)="onLaunch('STATUS_AD')" class="btn btn-outline">Launch</button>
            </div>
        </div>

        <!-- Card 4: Lead Form Ads -->
        <div class="action-card">
            <div class="card-icon"><i class="fa-solid fa-filter text-orange"></i></div>
            <div class="card-content">
                <h5>Lead Form Ads</h5>
                <p>Capture leads via WhatsApp</p>
                <button (click)="onLaunch('LEAD_FORM')" class="btn btn-outline">Launch</button>
            </div>
        </div>
    </div>
</div>
