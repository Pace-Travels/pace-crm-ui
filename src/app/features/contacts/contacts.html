<div class="contacts-layout">
    <!-- Inner Sidebar -->
    <div class="contacts-sidebar">
        <app-contacts-sidebar></app-contacts-sidebar>
    </div>

    <!-- Main Content -->
    <div class="contacts-content">
        <!-- Header area with title and metrics -->
        <div class="contacts-header">
            <h1 class="page-title">Contacts</h1>
            <div class="metrics-group">
                <div class="metric">
                    <span>Quality Rating <i class="fa-solid fa-circle-info info-icon"></i></span>
                    <span class="badge badge-high">High</span>
                </div>
                <div class="metric">
                    <span>Template Messaging Tier <i class="fa-solid fa-circle-info info-icon"></i></span>
                    <span class="value">Tier 1 (2K/24 Hours)</span>
                </div>
                <div class="metric">
                    <span>Remaining Quota <i class="fa-solid fa-circle-info info-icon"></i></span>
                    <span class="value fw-bold">1896</span>
                </div>
            </div>
        </div>

        <!-- Table and Controls -->
        <app-contacts-table></app-contacts-table>
    </div>
</div>
