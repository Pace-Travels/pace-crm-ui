<div class="contacts-layout">
    <!-- Inner Sidebar -->
    <div class="contacts-sidebar">
        <app-contacts-sidebar></app-contacts-sidebar>
    </div>

    <!-- Main Content -->
    <div class="contacts-content">
        <!-- Header area with title and metrics -->
        <div class="contacts-header" style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
            <div>
                <h1 class="page-title" style="margin: 0;">Contacts</h1>
                <p style="margin: 4px 0 0 0; font-size: 13px; color: #64748b;">Manage your B2C travelers & B2B tourism agent contacts and calculate broadcast campaign costs.</p>
            </div>
            
            <div style="display: flex; align-items: center; gap: 12px;">
                <button type="button" class="btn" (click)="toggleCalculator()" style="background: #0f172a; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <i class="fa-solid fa-calculator" style="color: #10b981;"></i>
                    {{ showCalculator() ? 'Hide Rate Calculator' : 'Global Meta Rate Calculator' }}
                </button>

                <div class="metrics-group">
                    <div class="metric">
                        <span>Quality Rating <i class="fa-solid fa-circle-info info-icon"></i></span>
                        <span class="badge badge-high">High</span>
                    </div>
                    <div class="metric">
                        <span>Messaging Tier</span>
                        <span class="value">Tier 1 (2K/24h)</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Global Meta Rate & GST Cost Calculator Widget -->
        @if (showCalculator()) {
            <app-whatsapp-cost-calculator></app-whatsapp-cost-calculator>
        }

        <!-- Table and Controls -->
        <app-contacts-table></app-contacts-table>
    </div>
</div>
