<div class="profile-container">
    <div class="header-section">
        <h1 class="page-title">Your Profile</h1>
    </div>

    <div class="profile-content">
        <div class="avatar-section" *ngIf="user">
            <div class="avatar">
                <span>{{ user.name ? user.name.charAt(0).toUpperCase() : 'U' }}</span>
            </div>
            <button class="btn-text">Edit</button>
            <button class="btn-outline" (click)="logout()">Logout</button>
        </div>

        <div class="form-section" *ngIf="user">
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" [value]="user.name || 'Not provided'" readonly>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="text" [value]="user.email || 'Not provided'" readonly>
            </div>

            <div class="form-group">
                <label>WhatsApp Number</label>
                <input type="text" value="Not provided" readonly>
            </div>

            <div class="form-group">
                <label>User Name</label>
                <input type="text" [value]="user.email || 'Not provided'" readonly>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" value="password" readonly>
            </div>
        </div>
    </div>
</div>
