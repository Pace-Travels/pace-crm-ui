<div class="live-chat-layout">
    <!-- Left Panel: Chat List -->
    <div class="panel-left">
        <app-chat-list></app-chat-list>
    </div>

    <!-- Middle Panel: Chat Window -->
    <div class="panel-middle">
        <app-chat-window></app-chat-window>
    </div>

    <!-- Right Panel: Chat Profile (Only show if conversation selected) -->
    @if(chatService.selectedConversation()) {
        <div class="panel-right">
            <app-chat-profile></app-chat-profile>
        </div>
    }

    <!-- FAB: Pull contacts from other agency projects -->
    <button id="pull-contacts-fab" class="pull-contacts-fab" (click)="showPullContacts.set(true)"
            title="Pull contacts from other projects" aria-label="Pull contacts from other projects">
        <i class="fa-solid fa-user-plus"></i>
        <span class="fab-label">Pull contacts</span>
    </button>
</div>

@if (showPullContacts()) {
    <app-pull-contacts-modal (close)="showPullContacts.set(false)"></app-pull-contacts-modal>
}
