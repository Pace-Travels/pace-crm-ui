<div class="chat-list-container">
    
    <!-- Top Search Bar -->
    <div class="search-header">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="Search name or mobile number">
        </div>
        <button class="filter-btn"><i class="fa-solid fa-filter"></i></button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab" [class.active]="activeTab === 'ACTIVE'" (click)="activeTab = 'ACTIVE'">
            ACTIVE ({{chatService.activeConversations().length}})
        </button>
        <button class="tab" [class.active]="activeTab === 'REQUESTING'" (click)="activeTab = 'REQUESTING'">
            REQUESTING (0)
        </button>
        <button class="tab" [class.active]="activeTab === 'INTERVENED'" (click)="activeTab = 'INTERVENED'">
            INTERVENED (0)
        </button>
    </div>

    <!-- List -->
    <div class="list-scroll">
        @for(conv of chatService.activeConversations(); track conv.id) {
            <div class="chat-item" 
                 [class.selected]="chatService.selectedConversation()?.id === conv.id"
                 (click)="selectChat(conv)">
                
                <div class="avatar">
                    {{ getAvatarInitial(conv.Contact?.firstName) }}
                </div>
                
                <div class="chat-info" style="flex: 1; overflow: hidden;">
                    <div class="chat-name" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>{{ conv.Contact?.firstName || 'UNKNOWN' }} {{ conv.Contact?.lastName || '' }}</span>
                        @if (conv.Messages?.[0]?.status === 'FAILED') {
                            <i class="fa-solid fa-circle-exclamation" style="color: #ef4444; font-size: 12px;" title="Action Required: Message Failed"></i>
                        }
                    </div>
                    <div class="chat-preview" [style.color]="conv.Messages?.[0]?.status === 'FAILED' ? '#ef4444' : ''" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px;">
                        {{ formatPreview(conv.Messages?.[0]) }}
                    </div>
                </div>
            </div>
        }
    </div>
</div>
